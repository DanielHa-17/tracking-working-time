appId: io.github.danielha17.trackingworkingtime
productName: Tracking Working Time
copyright: Copyright © 2026 Minh Khoi Ha
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
mac:
  target:
    - target: dir
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.productivity
  icon: build/icon.icns
  minimumSystemVersion: '13.0'
  # No paid Apple Developer account: the app is signed ad hoc after the fuses are set.
  identity: null
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
# Electron fuses turn off features this app never uses, so they cannot be abused.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  resetAdHocDarwinSignature: true
